<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soal Pertama - Form Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">
    <div class="header-container">
        <div class="perforation"></div>
        <div class="header-title">Soal Pertama :)</div>
    </div>

    <div class="judul">Formulir Entah Apa</div>

    <div class="form-container">
        <div class="form-row">
            <div class="label-cell">Username</div>
            <div class="input-cell">
                <input type="text" placeholder="Username">
            </div>
        </div>

        <div class="form-row">
            <div class="label-cell">Password</div>
            <div class="input-cell">
                <input type="password" placeholder="Password">
            </div>
        </div>

        <div class="form-row">
            <div class="label-cell">Verification Code</div>
            <div class="input-cell">
                <input type="text" placeholder="Isi kode anda">
            </div>
        </div>

        <div class="full-row remember-me">
            <input type="checkbox" id="rm"> 
            <label for="rm">Remember Me</label>
        </div>

        <div class="full-row submit-area">
            <button class="btn-submit">Submit</button>
        </div>
    </div>
</div>

</body>
</html>
