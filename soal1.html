<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soal 1 - Layout 300px & 500px</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <a href="soal2.html" class="floating-arrow" title="Lanjut ke Soal 2"> > </a>

    <div class="wrapper">
        <header class="yellow-header">
            <h1>Soal Pertama :)</h1>
        </header>

        <div class="main-container">
            <aside class="sidebar-300">
                <div class="menu-section">
                    <h3>Menu</h3>
                    <ul class="nav-links">
                        <li><a href="#">Soal Pertama</a></li>
                        <li><a href="soal2.html">Soal Kedua</a></li>
                    </ul>
                </div>
                
                <div class="search-section">
                    <h3>Search</h3>
                    <div class="search-group">
                        <input type="text" placeholder="Search this web">
                        <button type="button">GO!</button>
                    </div>
                </div>
            </aside>

            <main class="content-500">
                <h2 class="title-tabel">Tabel Sesuatu</h2>
                <div class="table-wrapper">
                    <table class="styled-table">
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Huruf</th>
                                <th>Keterangan</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td>1</td><td>A</td><td>Pertama</td></tr>
                            <tr><td>2</td><td>B</td><td>Kedua</td></tr>
                            <tr><td>3</td><td>C</td><td>Ketiga</td></tr>
                        </tbody>
                        <tfoot>
                            <tr><td colspan="3">Data di atas adalah data fiktif</td></tr>
                        </tfoot>
                    </table>
                </div>
            </main>
        </div>
    </div>

</body>
</html>
